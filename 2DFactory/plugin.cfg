[plugin]

name="2dfactory"
description="Imports and updates 2DFactory sprite-sheet JSON data into Godot, automatically creating SpriteFrames and AnimatedSprite2D/AnimatedSprite3D scenes with animation direction, pivot, socket transforms, normal-map support, and configurable sprite settings."
author="Tamara Rifqi"
version="1.0.0"
script="plugin.gd"
